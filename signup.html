<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriAware - Sign Up</title>
  <meta name="description" content="Create your NutriAware account to unlock full website access." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              deep: "#10281D",
              leaf: "#2B7A4B",
              lime: "#9AD15A",
              sun: "#F6C34A",
              clay: "#C96A3D",
              mist: "#EAF5E8"
            }
          },
          fontFamily: {
            heading: ["Fraunces", "serif"],
            body: ["Manrope", "sans-serif"]
          },
          boxShadow: {
            soft: "0 12px 30px rgba(16, 40, 29, 0.12)"
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="signup" class="page-surface auth-page bg-brand-mist text-brand-deep font-body min-h-screen">
  <div class="auth-orb auth-orb-a" aria-hidden="true"></div>
  <div class="auth-orb auth-orb-b" aria-hidden="true"></div>

  <header class="max-w-6xl mx-auto px-4 py-5 flex items-center justify-between">
    <a href="index.html" class="auth-brand">NutriAware</a>
    <a href="login.html" class="auth-top-link">Already have account?</a>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-8 lg:pb-12">
    <section class="auth-layout rounded-3xl p-4 lg:p-6">
      <div class="auth-grid">
        <article class="auth-panel auth-panel-hero">
          <p class="auth-badge"><img src="assets/icons/apple.svg" alt="" class="h-4 w-4" aria-hidden="true" />Create New Account</p>
          <h1 class="mt-4 text-4xl lg:text-5xl font-heading leading-tight">Build healthy habits with clarity and consistency.</h1>
        </article>

        <article class="auth-panel auth-panel-form">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-3xl font-heading flex items-center gap-2"><img src="assets/icons/protein-egg.svg" alt="" class="h-7 w-7" aria-hidden="true" />Create Account</h2>
            <a href="index.html" class="text-sm font-semibold text-brand-leaf hover:underline">Back to Home</a>
          </div>
          <p class="mt-2 text-sm text-brand-deep/70">Set up your account details to get started.</p>

          <form id="signupForm" class="mt-6 space-y-4" novalidate>
            <label class="text-sm font-semibold">Full Name
              <input id="signupName" type="text" required autocomplete="name" class="mt-2 w-full rounded-xl border border-brand-leaf/30 px-4 py-3" placeholder="Your name" />
            </label>
            <label class="text-sm font-semibold">Email Address
              <input id="signupEmail" type="email" required autocomplete="email" class="mt-2 w-full rounded-xl border border-brand-leaf/30 px-4 py-3" placeholder="you@example.com" />
            </label>
            <label class="text-sm font-semibold">Password
              <input id="signupPassword" type="password" required autocomplete="new-password" class="mt-2 w-full rounded-xl border border-brand-leaf/30 px-4 py-3" placeholder="At least 6 characters, no spaces" />
            </label>
            <button id="signupBtn" type="submit" class="w-full rounded-xl bg-brand-leaf px-5 py-3 font-semibold text-white hover:brightness-110 transition">Create NutriAware Account</button>
            <p id="signupError" class="hidden rounded-lg bg-red-100 px-3 py-2 text-sm text-red-700"></p>
            <p id="signupInfo" class="hidden rounded-lg bg-brand-mist px-3 py-2 text-xs text-brand-deep/75"></p>
          </form>

          <p class="mt-6 text-sm">Already registered? <a href="login.html" class="font-semibold underline hover:text-brand-leaf">Go to login</a>.</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="max-w-6xl mx-auto px-4 pb-6 text-xs text-brand-deep/65 flex flex-wrap items-center justify-between gap-2">
    <p>NutriAware • Better food decisions, every day.</p>
    <p>Educational use only.</p>
  </footer>

  <script src="auth.js"></script>
</body>
</html>
